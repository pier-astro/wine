[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "windkin"
version = "0.1.0"
description = "Relativistic radial-speed distributions for XSPEC"
requires-python = ">=3.10"
dependencies = ["numpy", "redwine"]

[tool.setuptools]
packages = ["windkin"]
